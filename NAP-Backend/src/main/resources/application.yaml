server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css
  shutdown: graceful

spring:
  application:
    name: NAP-Backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nexusgeneraldb
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:waluube69alvin@gmail.com}
    password: ${MAIL_PASSWORD:wljk fgtl ekph tcuo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

nap:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5177}
  contact:
    rate-limit:
      max-requests: ${CONTACT_RATE_LIMIT_MAX:10}
      window-seconds: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:3600}
  mail:
    from: ${MAIL_FROM:waluube69alvin@gmail.com}
    contact-to: ${CONTACT_MAIL_TO:waluube69alvin@gmail.com}
  emailjs:
    base-url: https://api.emailjs.com/api/v1.0/email/send
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    otp-template-id: ${EMAILJS_OTP_TEMPLATE_ID:template_rb2h0rh}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
  jwt:
    secret: ${JWT_SECRET:nexus-admin-secret-key-change-in-production-2024-ultra-secure}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
