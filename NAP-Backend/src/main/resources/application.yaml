server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css
  shutdown: graceful

spring:
  application:
    name: NAP-Backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:h2:mem:napdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}}
    username: ${JDBC_DATABASE_USER:${DATABASE_USER:sa}}
    password: ${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

nap:
  super-admin:
    # Bootstraps the first platform owner on startup when no SUPER_ADMIN account
    # exists. Idempotent: once a super-admin is present the values are ignored,
    # so they can stay set in the environment. No registration page exists for
    # the first account on purpose.
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    full-name: ${SUPER_ADMIN_FULL_NAME:Platform Administrator}
  tenancy:
    # Apex host for subdomain tenant routing, e.g. portal.example.com. A request
    # to muk.portal.example.com resolves tenant code "muk".
    base-domain: ${TENANT_BASE_DOMAIN:}
    # Tenant used when no host mapping applies. Empty falls back to the demo
    # tenant (id 1).
    default-tenant-code: ${TENANT_DEFAULT_CODE:}
    # Shared secret that lets the ML service select a tenant with an X-Tenant
    # header (X-Internal-Token must match). When empty, X-Tenant is ignored and
    # requests resolve by host only, so a public client cannot read another
    # university's content by guessing its code.
    internal-token: ${INTERNAL_API_TOKEN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179}
  contact:
    rate-limit:
      max-requests: ${CONTACT_RATE_LIMIT_MAX:10}
      window-seconds: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:3600}
  mail:
    from: ${MAIL_FROM:waluube69alvin@gmail.com}
    contact-to: ${CONTACT_MAIL_TO:waluube69alvin@gmail.com}
  emailjs:
    base-url: https://api.emailjs.com/api/v1.0/email/send
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    otp-template-id: ${EMAILJS_OTP_TEMPLATE_ID:template_rb2h0rh}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT:5000}
    read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT:120000}
    admin-token: ${ML_SERVICE_ADMIN_TOKEN:}
  otp:
    # When true, POST /api/v1/auth/otp/send echoes the generated code back in
    # the response body so it can be read without an inbox. This makes email
    # verification trivially bypassable -- never enable it on a deployed
    # environment.
    expose-code: ${NAP_OTP_EXPOSE_CODE:false}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  admission:
    scoring:
      # Which engine's answer is the decision of record. It changes what an officer
      # sees, and nothing else about the request path.
      #
      # LEGACY  - the pre-revision threshold comparison decides. This is a true
      #           no-op, kept so the new thresholds can be introduced without a
      #           behaviour change and rolled back instantly if they are wrong.
      # SHADOW  - behaves exactly like LEGACY to the applicant and the officer,
      #           but the new engine also scores and stores its opinion.
      # ENFORCE - the new engine decides.
      #
      # Every mode writes a row to admission_decisions, so the calibration set
      # starts filling immediately instead of waiting for a shadow run. The
      # outcome stored there is always the decision that actually stood; the new
      # engine's index, gates and data-quality flags are stored beside it.
      #
      # Leave this at LEGACY until the committee has seen the shadow comparison
      # and agreed a cutoffIndex per programme. A missing cutoffIndex sends
      # applicants to manual review rather than admitting or rejecting them.
      mode: ${ADMISSION_SCORING_MODE:LEGACY}

# Nexus Identity (the university-wide SSO provider). This service no longer mints
# its own tokens: it validates RS256 access tokens against the identity JWKS and
# forwards legacy login requests to the identity service during the migration.
nexus:
  identity:
    issuer: ${IDENTITY_ISSUER:http://localhost:9000}
    # Kept separate from the issuer because a container may reach the identity
    # service over a private hostname while browsers use the public one.
    base-url: ${IDENTITY_BASE_URL:${IDENTITY_ISSUER:http://localhost:9000}}
    # Only needed while the transitional login endpoints are still enabled.
    bootstrap-secret: ${IDENTITY_BOOTSTRAP_SECRET:}
    # Token audiences this API accepts. The claim is the OAuth client id.
    audiences: ${IDENTITY_ALLOWED_AUDIENCES:nexus-application-portal,nexus-admissions-dashboard,nexus-student-portal,nexus-registrar,nexus-lecturer,nexus-admissions-service}
    connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_READ_TIMEOUT:5s}

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
