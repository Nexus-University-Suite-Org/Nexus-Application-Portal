server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css
  shutdown: graceful

spring:
  application:
    name: NAP-Backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:napdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

nap:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  contact:
    rate-limit:
      max-requests: ${CONTACT_RATE_LIMIT_MAX:10}
      window-seconds: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:3600}
  emailjs:
    base-url: https://api.emailjs.com/api/v1.0/email/send
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
